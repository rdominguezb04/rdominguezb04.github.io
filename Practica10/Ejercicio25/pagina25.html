<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <table border "1" style="width: 250px; height: 50px;">
        <caption>Tabla 1</caption>
        <tr>
            <td style="background-color: orange;">Dato 1</td>
            <td>Dato 2</td>
        </tr>
        <tr>
            <td colspan="2">Dato 3</td>
        </tr>
    </table>
    <br>
    <table border "1" style="width: 250px; height: 50px;">
        <caption>Tabla 2</caption>
        <tr>
            <td colspan="2">Dato 1</td>
        </tr>
    
        <tr>
            <td style="background-color: yellow;">Dato 2</td>
            <td style="background-color: greenyellow;">Dato 3</td>
        </tr>
    </table>
    <br>
    <table border "1" style="width: 250px; height: 50px;">
        <caption>Tabla 3</caption>
        <tr>
            <td>Dato 1</td>
            <td rowspan="2">Dato 3</td>
        </tr>
        <tr>
            <td>Dato 2</td>
        </tr>
    </table>
    <br>
    <table border "1" style="width: 250px; height: 50px;">
        <caption>Tabla 4</caption>
        <tr style="background-color: blue;">
            <td rowspan="2">Dato 1</td>
            <td>Dato 2</td>
        </tr>
        <tr style="background-color: blue;">
            <td>Dato 3</td>
        </tr>
    </table>
    <br>
    <table border "1" style="width: 250px; height: 50px;">
        <caption>Tabla 5</caption>
        <tr>
            <td rowspan="2">Dato 1</td>
            <td>Dato 2</td>
        </tr>
        <tr>
            <td>Dato 3</td>
        </tr>
        <tr>
            <td colspan="2" style="background-color: rgb(241, 40, 241);">Dato 4</td>
        </tr>
    </table>
</body>
</html>
